<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FRAGMENTS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: url("images/fragments.jpg") center / cover no-repeat;
  font-family: 'Montserrat', sans-serif;
}

/* MENU DESKTOP — HAUT GAUCHE */
nav {
  position: fixed;
  top: 24px;
  left: 32px;
  display: flex;
  gap: 36px;
  z-index: 9999;
}

/* LIENS DESKTOP */
nav a {
  color: #f2f2f2;   /* blanc pour desktop */
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.35em;
  text-decoration: none;
  white-space: nowrap;
  transition: text-shadow 0.25s ease, transform 0.25s ease;
}

/* HALO DESKTOP */
nav a:hover {
  text-shadow: 0 0 6px #ffffffaa;
  transform: scale(1.05);
}

/* HAMBURGER MOBILE */
#hamburger {
  display: none;
  position: fixed;
  top: 16px;
  left: 16px;
  font-size: 28px;
  color: #ffffff;  /* blanc pour être visible */
  z-index: 10000;
  cursor: pointer;
}

/* MENU MOBILE — DÉROULÉ */
#mobileMenu {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  flex-direction: column;
  padding: 64px 0 0 0;
  background: rgba(0,0,0,0.3);  /* discret, minimaliste */
  align-items: center;
  z-index: 9998;
}

#mobileMenu a {
  display: block;
  margin: 12px 0;
  color: #ffff00;  /* jaune vif pour lisibilité sur FRAGMENTS */
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.35em;
  text-decoration: none;
  text-transform: uppercase;
  transition: text-shadow 0.25s ease, transform 0.25s ease;
}

#mobileMenu a:hover {
  text-shadow: 0 0 6px #ffffffaa;
  transform: scale(1.05);
}

/* RESPONSIVE MOBILE */
@media screen and (max-width: 768px) {
  nav {
    display: none;  /* desktop menu caché */
  }
  #hamburger {
    display: block;
  }
}
</style>
</head>

<body>

<!-- Desktop menu -->
<nav>
  <a href="index.html">Accueil</a>
  <a href="chants-noirs.html">Chants noirs</a>
  <a href="chroniques.html">Chroniques</a>
  <a href="contact.html">Contact</a>
</nav>

<!-- Hamburger et menu mobile -->
<div id="hamburger">☰</div>
<div id="mobileMenu">
  <a href="index.html">Accueil</a>
  <a href="chants-noirs.html">Chants noirs</a>
  <a href="chroniques.html">Chroniques</a>
  <a href="contact.html">Contact</a>
</div>

<script>
const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobileMenu');

hamburger.addEventListener('click', () => {
  if (mobileMenu.style.display === 'flex') {
    mobileMenu.style.display = 'none';
  } else {
    mobileMenu.style.display = 'flex';
  }
});
</script>

</body>
</html>

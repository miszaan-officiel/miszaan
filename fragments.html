<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FRAGMENTS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: url("images/fragments.jpg") center / cover no-repeat;
  font-family: 'Montserrat', sans-serif;
}

/* MENU HORIZONTAL — DESKTOP */
nav {
  position: fixed;
  top: 24px;
  left: 32px;
  display: flex;
  gap: 36px;
  z-index: 9999;
}

/* LIENS DESKTOP */
nav a {
  color: #ffffff;
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.35em;
  text-decoration: none;
  white-space: nowrap;
  transition: text-shadow 0.25s ease, transform 0.25s ease;
}

nav a:hover {
  text-shadow: 0 0 6px #ffffffaa;
  transform: scale(1.05);
}

/* HAMBURGER MOBILE */
#hamburger {
  display: none;
  position: fixed;
  top: 16px;
  left: 16px;
  font-size: 28px;
  color: #ffffff; /* hamburger blanc */
  z-index: 10000;
  cursor: pointer;
}

/* MENU VERTICAL — MOBILE */
.mobile-menu {
  display: none;
  position: fixed;
  top: 60px;
  left: 16px;
  flex-direction: column;
  gap: 20px;
  background: rgba(0,0,0,0.5); /* léger fond derrière les onglets */
  padding: 12px 16px;
  border-radius: 6px;
  z-index: 9999;
}

.mobile-menu a {
  color: #ffff00; /* jaune vif pour lisibilité */
  font-weight: 700;
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: 0.25em;
  transition: text-shadow 0.25s ease, transform 0.25s ease;
}

.mobile-menu a:hover {
  text-shadow: 0 0 6px #ffffffaa;
  transform: scale(1.05);
}

/* MOBILE — affichage */
@media screen and (max-width: 768px) {
  nav {
    display: none; /* on masque le desktop horizontal */
  }
  #hamburger {
    display: block;
  }
}
</style>
</head>

<body>

<!-- HAMBURGER -->
<div id="hamburger">☰</div>

<!-- MENU DESKTOP -->
<nav>
  <a href="index.html">Accueil</a>
  <a href="chants-noirs.html">Chants noirs</a>
  <a href="chroniques.html">Chroniques</a>
  <a href="contact.html">Contact</a>
</nav>

<!-- MENU MOBILE -->
<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">Accueil</a>
  <a href="chants-noirs.html">Chants noirs</a>
  <a href="chroniques.html">Chroniques</a>
  <a href="contact.html">Contact</a>
</div>

<script>
const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobileMenu');

hamburger.addEventListener('click', () => {
  if (mobileMenu.style.display === "flex") {
    mobileMenu.style.display = "none";
  } else {
    mobileMenu.style.display = "flex";
  }
});
</script>

</body>
</html>

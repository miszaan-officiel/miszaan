<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FRAGMENTS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: url("images/fragments.jpg") center / cover no-repeat;
  font-family: 'Montserrat', sans-serif;
}

/* MENU DESKTOP — inchangé */
nav.desktop {
  position: fixed;
  top: 24px;
  left: 32px;
  display: flex;
  gap: 36px;
  z-index: 9999;
}

nav.desktop a {
  color: #f2f2f2; /* blanc */
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.35em;
  text-decoration: none;
  white-space: nowrap;
  transition: text-shadow 0.25s ease, transform 0.25s ease;
}

nav.desktop a:hover {
  text-shadow: 0 0 6px #ffffffaa;
  transform: scale(1.05);
}

/* HAMBURGER MOBILE — à gauche, blanc */
#hamburger {
  display: none; /* caché desktop */
  position: fixed;
  top: 24px;
  left: 32px;
  width: 36px;
  height: 36px;
  cursor: pointer;
  z-index: 9999;
}

#hamburger span {
  display: block;
  height: 4px;
  margin: 6px 0;
  background-color: #f2f2f2; /* blanc identique desktop */
  border-radius: 2px;
  transition: 0.3s;
}

/* MENU MOBILE — minimaliste et discret */
nav.mobile {
  display: none;
  flex-direction: column;
  position: fixed;
  top: 64px; /* juste sous le hamburger */
  left: 0;
  width: 100%;
  padding: 0;
  z-index: 9998;
}

nav.mobile a {
  color: #ffff00; /* jaune vif pour FRAGMENTS */
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.35em;
  text-decoration: none;
  font-size: 18px;
  padding: 12px 24px;
  background-color: rgba(0,0,0,0.25); /* discret */
  border-bottom: 1px solid #222;
  transition: background 0.25s, transform 0.25s;
}

nav.mobile a:hover {
  background: rgba(0,0,0,0.4);
  transform: scale(1.03);
}

/* RESPONSIVE */
@media screen and (max-width: 768px) {
  nav.desktop {
    display: none;
  }
  #hamburger {
    display: block;
  }
}
</style>

</head>
<body>

<!-- MENU DESKTOP -->
<nav class="desktop">
  <a href="index.html">Accueil</a>
  <a href="chants-noirs.html">Chants noirs</a>
  <a href="chroniques.html">Chroniques</a>
  <a href="contact.html">Contact</a>
</nav>

<!-- HAMBURGER MOBILE -->
<div id="hamburger">
  <span></span>
  <span></span>
  <span></span>
</div>

<!-- MENU MOBILE -->
<nav class="mobile" id="mobileMenu">
  <a href="index.html">Accueil</a>
  <a href="chants-noirs.html">Chants noirs</a>
  <a href="chroniques.html">Chroniques</a>
  <a href="contact.html">Contact</a>
</nav>

<script>
// Toggle menu mobile
const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobileMenu');

hamburger.addEventListener('click', () => {
  if (mobileMenu.style.display === 'flex') {
    mobileMenu.style.display = 'none';
  } else {
    mobileMenu.style.display = 'flex';
  }
});
</script>

</body>
</html>

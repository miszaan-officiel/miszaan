<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CHANTS NOIRS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: 'IM Fell English SC', serif;
  background: url("images/chants-noirs.jpg") center / cover no-repeat;
}

/* MENU VERTICAL GAUCHE */
nav {
  position: absolute;
  top: 48px;
  left: 32px;   
  display: flex;
  flex-direction: column; /* vertical */
  gap: 40px; /* espace suffisant pour respirer */
}

nav a {
  text-decoration: none;
  font-size: 20px; /* taille originale */
  font-weight: normal;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #1a1a1a; /* foncé pour contraste */
  padding-bottom: 6px;
  transition: color 0.25s, text-shadow 0.25s;
}

/* Halo sur survol */
nav a:hover {
  color: #1a1a1a;
  text-shadow: 0 0 6px #ffffff88;
}
</style>
</head>

<body>
<style>
/* === MENU BLOODBONE HORIZONTAL POUR DESKTOP + MOBILE === */

/* Desktop & mobile large */
nav {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  display: flex !important;
  justify-content: center !important; /* centré horizontalement */
  gap: 40px !important;
  padding: 16px 0 !important;
  background: rgba(15, 10, 10, 0.85) !important; /* sombre, semi-transparent */
  box-shadow: 0 2px 15px #00000088 inset, 0 0 20px #88000044 !important;
  z-index: 999 !important;
  border-bottom: 2px solid #880000 !important;
}

/* Liens du menu */
nav a {
  color: #ffdddd !important;
  font-size: 1.1rem !important;
  font-weight: bold !important;
  letter-spacing: 0.2em !important;
  text-transform: uppercase !important;
  text-decoration: none !important;
  padding: 8px 12px !important;
  text-shadow: 0 0 5px #55000088, 0 0 8px #ff111188 !important;
  transition: all 0.2s ease-in-out !important;
}

nav a:hover {
  color: #ff8888 !important;
  text-shadow: 0 0 10px #ff2222, 0 0 15px #ff5555 !important;
  transform: scale(1.1) !important;
}

/* === Ajustements mobile === */
@media screen and (max-width: 768px) {
  nav {
    flex-direction: row !important; /* horizontal */
    justify-content: space-around !important;
    gap: 12px !important;
    padding: 10px 0 !important;
  }

  nav a {
    font-size: 1rem !important;
    padding: 6px 8px !important;
  }
}
</style>

<nav>
  <a href="index.html">Accueil</a>
  <a href="fragments.html">Fragments</a>
  <a href="chroniques.html">Chroniques</a>
  <a href="contact.html">Contact</a>
</nav>

</body>
</html>

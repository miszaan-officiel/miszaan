<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCUEIL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: 'Roboto Mono', monospace;
  background: url("images/accueil.jpg") center / cover no-repeat;
}

/* MENU HORIZONTAL */
nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: flex-start; /* à gauche */
  gap: 40px;
  padding: 16px 32px;
  background: rgba(0,0,0,0.5);
  z-index: 999;
}

nav a {
  text-decoration: none;
  font-size: 1.1rem;
  font-weight: 500;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #f2f2f2;
  transition: all 0.25s;
}

nav a:hover {
  color: #ffffff;
  text-shadow: 0 0 8px #ffffff88;
  transform: scale(1.05);
}

/* MOBILE */
@media (max-width: 768px) {
  nav {
    justify-content: center;
    gap: 20px;
    padding: 10px 16px;
  }
  nav a {
    font-size: 0.95rem;
    letter-spacing: 0.2em;
    padding: 4px 6px;
  }
}
</style>
</head>

<body>
<nav>
  <a href="chants-noirs.html">Chants noirs</a>
  <a href="fragments.html">Fragments</a>
  <a href="chroniques.html">Chroniques</a>
  <a href="contact.html">Contact</a>
</nav>
</body>
</html>

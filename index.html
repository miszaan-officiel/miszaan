/* Réinitialisation */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {

  background-image: url('tonfond.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* Menu */
.menu {
  background: rgba(0,0,0,0.8);
  padding: 10px;
  position: relative;
  z-index: 1000;
}

.menu ul {
  list-style: none;
  display: none; /* mobile par défaut */
  flex-direction: column;
  gap: 10px;
  margin-top: 10px;
}

.menu a {
  text-decoration: none;
  color: #eee;
  font-weight: bold;
  padding: 5px 10px;
}

}

.menu .hamburger {
  display: block;
  font-size: 1.5em;
  cursor: pointer;
}

/* Menu ouvert */
.menu.active ul {
  display: flex;
}

/* Sections */
.section {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
  text-align: center;
}

/* Images internes */
.section img {
  max-width: 100%;
  height: auto;
}

/* Desktop */
@media (min-width: 1024px) {
  .menu ul {
    display: flex !important;
    flex-direction: row;
    gap: 20px;
    margin-top: 0;
  }
  .menu .hamburger { display: none; }

  .section {
    flex-direction: row;
    justify-content: space-around;
    align-items: center;
    padding: 50px;
    text-align: left;
  }

  .section img {
    max-width: 50%;
  }
}
</style>

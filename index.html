<style>

/* MENU HORIZONTAL — SANS FOND */
nav {

  padding: 6px 0;
  background: none;
  z-index: 999;

  text-transform: uppercase;
  text-decoration: none;

nav a:hover {
  color: #f2f2f2;
  text-shadow: 0 0 6px #ffffff88;
  transform: scale(1.05);
}

  nav {
    justify-content: space-around;
    padding: 4px 0;
    gap: 8px;

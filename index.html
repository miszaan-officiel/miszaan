<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ACCUEIL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: 'IM Fell English SC', serif;
  background: url("images/accueil.jpg") center / cover no-repeat;
}

/* MENU VERTICAL GAUCHE */
nav {
  position: absolute;
  top: 48px;
  left: 32px;   
  display: flex;
  flex-direction: column; /* vertical */
  gap: 40px; /* espace suffisant pour respirer */
}

nav a {
  text-decoration: none;
  font-size: 20px; /* taille originale, bien lisible */
  font-weight: normal;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #f2f2f2;
  padding-bottom: 6px;
  transition: color 0.25s, text-shadow 0.25s;
}

/* Halo sur survol universel BloodBone */
nav a:hover {
  color: #f2f2f2;
  text-shadow: 0 0 6px #ffffff88;
}
</style>
<link rel="stylesheet" href="style-mobile.css">
</head>

<body>
<style>
@media screen and (max-width: 768px) {
  nav {
    position: fixed !important;
    top: 12px !important;
    left: 12px !important;
    right: 12px !important;
    background: rgba(10, 10, 10, 0.85) !important;
    padding: 12px 18px !important;
    border-radius: 6px !important;
    display: flex !important;
    flex-direction: column !important;
    gap: 12px !important;
    z-index: 999 !important;
  }

  nav a {
    color: #f2f2f2 !important;
    font-size: 1rem !important;
    letter-spacing: 0.18em !important;
    text-transform: uppercase !important;
    text-decoration: none !important;
    padding: 6px 0 !important;
    text-shadow: 0 0 3px rgba(0,0,0,0.8) !important;
  }

  nav a + a {
    margin-top: 8px !important;
  }

  nav a:hover {
    text-shadow: 0 0 6px #ffffff88 !important;
  }
}
</style>

<nav>
  <a href="chants-noirs.html">Chants noirs</a>
  <a href="fragments.html">Fragments</a>
  <a href="chroniques.html">Chroniques</a>
  <a href="contact.html">Contact</a>
</nav>

</body>
</html>

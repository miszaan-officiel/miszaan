<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ACCUEIL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: url("images/accueil.jpg") center / cover no-repeat;
  font-family: 'Montserrat', sans-serif;
}

/* MENU HORIZONTAL — DESKTOP */
nav {
  position: fixed;
  top: 24px;
  left: 32px;
  display: flex;
  gap: 36px;
  z-index: 9999;
}

/* LIENS DESKTOP */
nav a {
  color: #f2f2f2;
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.35em;
  text-decoration: none;
  white-space: nowrap;
  transition: text-shadow 0.25s ease, transform 0.25s ease;
}

nav a:hover {
  text-shadow: 0 0 6px #ffffffaa;
  transform: scale(1.05);
}

/* HAMBURGER MOBILE — invisible desktop */
#hamburger {
  display: none;
  position: fixed;
  top: 16px;
  right: 16px;
  font-size: 32px;
  color: #f2f2f2; /* clair pour être visible */
  z-index: 10000;
  cursor: pointer;
}

/* MENU VERTICAL MOBILE — caché par défaut */
#mobileMenu {
  display: none;
  position: fixed;
  top: 64px;
  right: 16px;
  background: none;
  flex-direction: column;
  gap: 16px;
  z-index: 9999;
}

#mobileMenu a {
  color: #f2f2f2;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  text-decoration: none;
  white-space: nowrap;
  transition: text-shadow 0.25s ease, transform 0.25s ease;
}

#mobileMenu a:hover {
  text-shadow: 0 0 6px #ffffffaa;
  transform: scale(1.05);
}

/* MOBILE — affichage hamburger et menu vertical */
@media screen and (max-width: 768px) {
  nav {
    display: none; /* desktop horizontal désactivé */
  }
  #hamburger {
    display: block;
  }
}
</style>
</head>

<body>

<!-- MENU DESKTOP -->
<nav>
  <a href="chants-noirs.html">Chants noirs</a>
  <a href="fragments.html">Fragments</a>
  <a href="chroniques.html">Chroniques</a>
  <a href="contact.html">Contact</a>
</nav>

<!-- HAMBURGER MOBILE -->
<div id="hamburger">☰</div>

<!-- MENU MOBILE -->
<div id="mobileMenu">
  <a href="chants-noirs.html">Chants noirs</a>
  <a href="fragments.html">Fragments</a>
  <a href="chroniques.html">Chroniques</a>
  <a href="contact.html">Contact</a>
</div>

<script>
const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobileMenu');

hamburger.addEventListener('click', () => {
  if (mobileMenu.style.display === 'flex') {
    mobileMenu.style.display = 'none';
  } else {
    mobileMenu.style.display = 'flex';
  }
});
</script>

</body>
</html>

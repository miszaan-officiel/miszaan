<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CONTACT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: 'IM Fell English SC', serif;
  background: url("images/contact.jpg") center / cover no-repeat;
  color: #f2f2f2;
}

/* MENU VERTICAL GAUCHE */
nav {
  position: absolute;
  top: 48px;
  left: 32px;
  display: flex;
  flex-direction: column;
  gap: 40px;
}

nav a {
  text-decoration: none;
  font-size: 20px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #f2f2f2;
  padding-bottom: 6px;
  transition: color 0.25s, text-shadow 0.25s;
}

nav a:hover {
  color: #f2f2f2;
  text-shadow: 0 0 6px #ffffff88;
}

/* FORMULAIRE BLOODBONE - À DROITE */
form {
  position: absolute;
  top: 48px;
  right: 48px;
  width: 380px;
  background: rgba(26, 26, 26, 0.85); /* sombre semi-transparent */
  border: 2px solid #880000; /* bordure sanglante */
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 0 12px #000000aa;
}

input, textarea, button {
  font-family: 'IM Fell English SC', serif;
  font-size: 16px;
  padding: 10px;
  border: 2px solid #880000;
  border-radius: 2px;
  background: #1a1a1a;
  color: #f2f2f2;
  transition: all 0.25s;
}

input:focus, textarea:focus {
  border-color: #ff0000;
  box-shadow: 0 0 8px #ff000080;
  outline: none;
}

button {
  background-color: #880000;
  color: #f2f2f2;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.25s;
}

button:hover {
  background-color: #ff0000;
  box-shadow: 0 0 10px #ff000080;
}
</style>
</head>

<body>

<nav>
  <a href="index.html">Accueil</a>
  <a href="chants-noirs.html">Chants noirs</a>
  <a href="fragments.html">Fragments</a>
  <a href="chroniques.html">Chroniques</a>
</nav>

<form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
  <input type="text" name="name" placeholder="Nom" required>
  <input type="email" name="email" placeholder="Email" required>
  <input type="text" name="subject" placeholder="Objet" required>
  <textarea name="message" placeholder="Votre message" rows="6" required></textarea>
  <button type="submit">Envoyer</button>
</form>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CONTACT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: url("images/contact.jpg") center / cover no-repeat;
  font-family: 'Montserrat', sans-serif;
}

/* MENU HORIZONTAL — HAUT GAUCHE — TOUJOURS VISIBLE */
nav {
  position: fixed;
  top: 24px;
  left: 32px;
  display: flex;
  gap: 36px;
  z-index: 9999;
}

/* LIENS */
nav a {
  color: #f2f2f2;
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.35em;
  text-decoration: none;
  white-space: nowrap;
  transition: text-shadow 0.25s ease, transform 0.25s ease;
}

/* HALO */
nav a:hover {
  text-shadow: 0 0 6px #ffffffaa;
  transform: scale(1.05);
}

/* MOBILE — ON GARDE LE MENU */
@media screen and (max-width: 768px) {
  nav {
    top: 16px;
    left: 16px;
    gap: 16px;
  }

  nav a {
    font-size: 12px;
    letter-spacing: 0.25em;
  }
}

/* FORMULAIRE BLOODBONE – CENTRÉ, BAS */
form {
  position: absolute;
  left: 50%;
  top: 60%; /* assez bas */
  transform: translate(-50%, -50%);
  width: 350px;
  background: rgba(0,0,0,0.55); /* semi-transparent, fondu dans le décor */
  border-radius: 6px 2px 10px 4px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 0 12px #00000099;
}

/* CHAMPS ET BOUTON */
input, textarea, button {
  font-family: 'Montserrat', sans-serif;
  font-size: 15px;
  padding: 8px;
  border: none; /* contours rouges supprimés */
  border-radius: 4px 2px 6px 3px;
  background: rgba(26,26,26,0.6);
  color: #f2f2f2;
  transition: all 0.25s;
}

input:focus, textarea:focus {
  outline: none;
  box-shadow: 0 0 8px #ffffff44;
}

button {
  background-color: rgba(40,0,0,0.7);
  color: #f2f2f2;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s;
  border-radius: 4px 2px 6px 3px;
}

button:hover {
  background-color: rgba(60,0,0,0.8);
  box-shadow: 0 0 10px #ffffff33;
}
</style>
</head>

<body>

<nav>
  <a href="index.html">Accueil</a>
  <a href="chants-noirs.html">Chants noirs</a>
  <a href="fragments.html">Fragments</a>
  <a href="chroniques.html">Chroniques</a>
</nav>

<form action="https://formspree.io/f/xojjbkqk" method="POST">
  <input type="text" name="name" placeholder="Nom" required>
  <input type="email" name="email" placeholder="Email" required>
  <input type="text" name="subject" placeholder="Objet" required>
  <textarea name="message" placeholder="Votre message" rows="5" required></textarea>
  <button type="submit">Envoyer</button>
</form>

</body>
</html>

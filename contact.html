<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CONTACT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: url("images/contact.jpg") center / cover no-repeat;
  font-family: 'Montserrat', sans-serif;
}

/* MENU — STRICTEMENT IDENTIQUE À ACCUEIL */
nav {
  position: fixed;
  top: 24px;
  left: 32px;
  display: flex;
  gap: 36px;
  z-index: 9999;
}

nav a {
  color: #f2f2f2;
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.35em;
  text-decoration: none;
  white-space: nowrap;
  transition: text-shadow 0.25s ease, transform 0.25s ease;
}

nav a:hover {
  text-shadow: 0 0 6px #ffffffaa;
  transform: scale(1.05);
}

@media screen and (max-width: 768px) {
  nav {
    top: 16px;
    left: 16px;
    gap: 16px;
  }

  nav a {
    font-size: 12px;
    letter-spacing: 0.25em;
  }
}

/* FORMULAIRE — CENTRÉ, BAS, LISIBLE */
form {
  position: absolute;
  left: 50%;
  top: 62%;
  transform: translate(-50%, -50%);
  width: 380px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  background: rgba(240,240,240,0.15);
  backdrop-filter: blur(3px);
  border-radius: 8px;
  box-shadow: 0 0 24px rgba(0,0,0,0.45);
}

input, textarea {
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  padding: 10px;
  border: none;
  border-radius: 4px;
  background: rgba(255,255,255,0.25);
  color: #111;
}

input::placeholder,
textarea::placeholder {
  color: #333;
}

input:focus,
textarea:focus {
  outline: none;
  background: rgba(255,255,255,0.35);
}

button {
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  padding: 10px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  background: rgba(255,255,255,0.35);
  color: #111;
  transition: background 0.25s ease, box-shadow 0.25s ease;
}

button:hover {
  background: rgba(255,255,255,0.5);
  box-shadow: 0 0 10px rgba(255,255,255,0.4);
}
</style>
</head>

<body>

<nav>
  <a href="index.html">Accueil</a>
  <a href="chants-noirs.html">Chants noirs</a>
  <a href="fragments.html">Fragments</a>
  <a href="chroniques.html">Chroniques</a>
</nav>

<form action="https://formspree.io/f/xojjbkqk" method="POST">
  <input type="text" name="name" placeholder="Nom" required>
  <input type="email" name="email" placeholder="Email" required>
  <input type="text" name="subject" placeholder="Objet" required>
  <textarea name="message" placeholder="Votre message" rows="6" required></textarea>
  <button type="submit">Envoyer</button>
</form>

</body>
</html>

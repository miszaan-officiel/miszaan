<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTACT - BloodBone</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: Arial,sans-serif; background-color:#111; color:#eee; background-image:url('tonfond.jpg'); background-size:cover; background-position:center; background-repeat:no-repeat;}
.menu { background:rgba(0,0,0,0.8); padding:10px; position:relative; z-index:1000;}
.menu ul { list-style:none; display:none; flex-direction:column; gap:10px; margin-top:10px;}
.menu a { text-decoration:none; color:#eee; font-weight:bold; padding:5px 10px;}
.menu a:hover { background:rgba(255,255,255,0.1); border-radius:4px;}
.menu .hamburger { display:block; font-size:1.5em; cursor:pointer;}
.menu.active ul { display:flex;}
.section { min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px; text-align:center;}
.section img { max-width:100%; height:auto;}
form { display:flex; flex-direction:column; gap:15px; width:90%; max-width:500px;}
input, textarea { padding:10px; border:none; border-radius:5px; font-size:1em; }
button { padding:10px; border:none; border-radius:5px; background:#444; color:#eee; font-weight:bold; cursor:pointer; }
button:hover { background:#666; }
@media (min-width:1024px){
.menu ul { display:flex !important; flex-direction:row; gap:20px; margin-top:0;}
.menu .hamburger { display:none;}
.section { flex-direction:row; justify-content:space-around; align-items:center; padding:50px; text-align:left;}
.section img { max-width:50%;}
form { width:50%; }
}
</style>
</head>
<body>

<div class="menu">
  <span class="hamburger">&#9776;</span>
  <ul>
    <li><a href="ACCUEIL.html">ACCUEIL</a></li>
    <li><a href="CHANTS NOIRS.html">CHANTS NOIRS</a></li>
    <li><a href="FRAGMENTS.html">FRAGMENTS</a></li>
    <li><a href="CHRONIQUES.html">CHRONIQUES</a></li>
    <li><a href="CONTACT.html">CONTACT</a></li>
  </ul>
</div>

<div class="section">
  <h1>Contactez-nous</h1>
  <p>Envoyez vos questions, commentaires ou suggestions.</p>
  <form>
    <input type="text" placeholder="Nom" required>
    <input type="email" placeholder="Email" required>
    <textarea rows="5" placeholder="Message" required></textarea>
    <button type="submit">Envoyer</button>
  </form>
</div>

<script>
const menu = document.querySelector('.menu');
const button = document.querySelector('.menu .hamburger');
button.addEventListener('click', () => {
  menu.classList.toggle('active');
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CONTACT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: 'IM Fell English SC', serif;
  background: url("images/contact.jpg") center / cover no-repeat;
}

/* MENU VERTICAL GAUCHE */
nav {
  position: absolute;
  top: 48px;
  left: 32px;   
  display: flex;
  flex-direction: column; /* vertical */
  gap: 40px; /* espace suffisant pour respirer */
}

nav a {
  text-decoration: none;
  font-size: 20px; /* taille originale */
  font-weight: normal;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #f2f2f2; /* clair pour contraste */
  padding-bottom: 6px;
  transition: color 0.25s, text-shadow 0.25s;
}

/* Halo sur survol */
nav a:hover {
  color: #f2f2f2;
  text-shadow: 0 0 6px #ffffff88;
}

/* Formulaire */
form {
  position: absolute;
  top: 150px;
  left: 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 400px;
}

input, textarea, button {
  font-family: 'IM Fell English SC', serif;
  font-size: 16px;
  padding: 8px;
  border: none;
  border-radius: 4px;
}

button {
  background-color: #f2f2f2;
  color: #1a1a1a;
  cursor: pointer;
  transition: background-color 0.25s;
}

button:hover {
  background-color: #ffffffaa;
}
</style>
</head>

<body>

<nav>
  <a href="index.html">Accueil</a>
  <a href="chants-noirs.html">Chants noirs</a>
  <a href="fragments.html">Fragments</a>
  <a href="chroniques.html">Chroniques</a>
</nav>

<form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
  <input type="text" name="name" placeholder="Nom" required>
  <input type="email" name="email" placeholder="Email" required>
  <textarea name="message" placeholder="Votre message" rows="6" required></textarea>
  <button type="submit">Envoyer</button>
</form>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CONTACT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: 'IM Fell English SC', serif;
  background: url("images/contact.jpg") center / cover no-repeat;
  color: #f2f2f2;
}

/* MENU VERTICAL GAUCHE */
nav {
  position: absolute;
  top: 48px;
  left: 32px;
  display: flex;
  flex-direction: column;
  gap: 40px;
}

nav a {
  text-decoration: none;
  font-size: 20px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #f2f2f2;
  padding-bottom: 6px;
  transition: color 0.25s, text-shadow 0.25s;
}

nav a:hover {
  color: #f2f2f2;
  text-shadow: 0 0 6px #ffffff88;
}

/* FORMULAIRE BLOODBONE – À DROITE */
form {
  position: absolute;
  top: 48px;
  right: 48px;
  width: 400px;
  background: url('images/texture-grain-rouge.jpg') repeat; /* texture grattée */
  border: 3px solid #4a0000; /* rouge oxydé */
  border-radius: 6px 2px 10px 4px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 0 16px #000000cc;
}

/* CHAMPS ET BOUTON */
input, textarea, button {
  font-family: 'IM Fell English SC', serif;
  font-size: 16px;
  padding: 10px;
  border: 2px solid #4a0000;
  border-radius: 4px 2px 6px 3px; /* irrégulier */
  background: rgba(26,26,26,0.85);
  color: #f2f2f2;
  transition: all 0.25s;
  background-image: url('images/texture-grain-rouge-champ.jpg'); /* subtil grattage */
  background-size: cover;
}

input:focus, textarea:focus {
  border-color: #7a0000;
  box-shadow: 0 0 10px #7a000080;
  outline: none;
}

button {
  background-color: #4a0000;
  color: #f2f2f2;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.25s;
  border-radius: 4px 2px 6px 3px;
}

button:hover {
  background-color: #7a0000;
  box-shadow: 0 0 12px #7a000080;
}
</style>
  <style>
/* === MENU DESKTOP === */
nav {
  position: fixed;
  top: 0;
  left: 0;
  display: flex;
  gap: 24px;
  padding: 16px 24px;
  z-index: 1000;
}

nav a {
  font-size: 16px;
  color: #eaeaea;
  text-decoration: none;
  letter-spacing: 0.18em;
}

/* === MOBILE : ON CACHE LE MENU === */
@media (max-width: 768px) {
  nav {
    display: none;
  }
}
</style>

</head>

<style>
/* === MENU BLOODBONE HORIZONTAL POUR DESKTOP + MOBILE === */

/* Desktop & mobile large */
nav {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  display: flex !important;
  justify-content: center !important; /* centré horizontalement */
  gap: 40px !important;
  padding: 16px 0 !important;
  background: rgba(15, 10, 10, 0.85) !important; /* sombre, semi-transparent */
  box-shadow: 0 2px 15px #00000088 inset, 0 0 20px #88000044 !important;
  z-index: 999 !important;
  border-bottom: 2px solid #880000 !important;
}

/* Liens du menu */
nav a {
  color: #ffdddd !important;
  font-size: 1.1rem !important;
  font-weight: bold !important;
  letter-spacing: 0.2em !important;
  text-transform: uppercase !important;
  text-decoration: none !important;
  padding: 8px 12px !important;
  text-shadow: 0 0 5px #55000088, 0 0 8px #ff111188 !important;
  transition: all 0.2s ease-in-out !important;
}

nav a:hover {
  color: #ff8888 !important;
  text-shadow: 0 0 10px #ff2222, 0 0 15px #ff5555 !important;
  transform: scale(1.1) !important;
}

/* === Ajustements mobile === */
@media screen and (max-width: 768px) {
  nav {
    flex-direction: row !important; /* horizontal */
    justify-content: space-around !important;
    gap: 12px !important;
    padding: 10px 0 !important;
  }

  nav a {
    font-size: 1rem !important;
    padding: 6px 8px !important;
  }
}
</style>
<style>
/* === MENU HORIZONTAL BLOODBONE MINIMALISTE === */
nav {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  display: flex !important;
  justify-content: center !important; /* tous les liens centrés */
  align-items: center !important;
  gap: 20px !important; /* espace entre les liens */
  padding: 6px 0 !important;
  background: none !important; /* rien derrière */
  border: none !important;
  box-shadow: none !important;
  z-index: 999 !important;
  flex-wrap: nowrap !important; /* pas de retour à la ligne, tout tient */
}

/* Liens du menu */
nav a {
  color: #f2f2f2 !important; /* blanc doux, lisible sur tous les fonds */
  font-size: 0.75rem !important; /* réduit pour tenir sur une ligne */
  font-weight: bold !important;
  letter-spacing: 0.1em !important;
  text-transform: uppercase !important;
  text-decoration: none !important;
  padding: 4px 8px !important;
  white-space: nowrap !important;
  transition: color 0.2s ease, transform 0.2s ease !important;
}

/* Survol / clic discret */
nav a:hover,
nav a:active {
  color: #dddddd !important; /* discret, plus de rouge dégueulasse */
  transform: scale(1.05) !important;
}

/* Ajustement mobile */
@media screen and (max-width: 768px) {
  nav {
    justify-content: space-around !important;
    padding: 4px 0 !important;
    gap: 8px !important;
  }
  nav a {
    font-size: 0.65rem !important; /* encore plus petit si nécessaire */
    padding: 3px 6px !important;
  }
}
</style>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: 'IM Fell English SC', serif;
  background: url("images/chroniques-3.jpg") center / cover no-repeat;

/* MENU HORIZONTAL BLOODBONE – CHRONIQUES */
nav {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  display: flex !important;
  justify-content: flex-start !important; /* aligné à gauche */
  gap: 24px !important;
  padding: 16px 24px !important;
  z-index: 999 !important;
  background: none !important; /* aucun fond */
}

nav a {

  font-weight: 700 !important;
  font-size: 1rem !important;
  letter-spacing: 0.18em !important;

  padding: 6px 12px !important;
  transition: all 0.2s ease-in-out !important;
}

nav a:hover {
  text-shadow: 0 0 6px #ffffff88 !important;
  transform: scale(1.05) !important;
}

  nav {
    justify-content: space-around !important;
    padding: 8px 0 !important;
    gap: 12px !important;

  nav a {
